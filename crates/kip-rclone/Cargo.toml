[package]
name = "kip-rclone"
version = "0.1.0"
edition = "2021"
description = "Cloud storage backup support via rclone"

[dependencies]
kip-rsync = { path = "../kip-rsync" }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Path handling
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
